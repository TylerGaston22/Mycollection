// Class:     CS445
// Assignment: BookstoreDB PHP Front End
// Purpose:   Query file for userAuth.php. Given a username + plain
//            password, return the CustomerID if the credentials match
//            a row in the Customer table, otherwise false.
//
//            Called by userAuth.php (slide 38) during the login POST.
//
// Pattern taken from queryValidUser.php in cs445_php_web.pdf (slide 39).
// Note: the class example uses a ChkPasswd stored procedure that compares
// a pre-hashed password inside the DB. Our data was loaded via
// BookstoreDB/php/insertUsers.php using PHP's password_hash (non-
// deterministic), so the check has to be done with password_verify() on
// the PHP side after pulling PasswordHash + Salt out of the Customer
// table. The shape of the function (same name, same return semantics)
// still matches the class slide.
// -------------------------------------------------------------------------

require_once(__DIR__ . '/connDB.php');
require_once(__DIR__ . '/basicErrorHandling.php');

// -------------------------------------------------------------------------
// Function: queryValidUser
// Purpose:  Validate a username + plain password against the Customer
//           table. Returns the matching CustomerID on success, or
//           false on any failure (bad user, bad password, DB error).
// Input:    $p_dbh  - open PDO handle
//           $p_user - username (string)
//           $p_pass - plain-text password as submitted by the user
// Return:   int CustomerID on success, bool false on failure
// -------------------------------------------------------------------------
function queryValidUser($p_dbh, $p_user, $p_pass)
{
    $vRetVal = false;

    try {
        $vStmt = $p_dbh->prepare('CALL GetCustomerLogin(:username)');
        $vStmt->bindValue(':username', $p_user);
        $vStmt->execute();

        $vRow = $vStmt->fetch(PDO::FETCH_ASSOC);
        $vStmt->closeCursor();

        if (isset($vRow['PasswordHash']) && isset($vRow['Salt'])) {
            // insertUsers.php stored password_hash($plain . $salt, ...)
            // so the reverse check is password_verify on the same combo.
            if (password_verify(
                    $p_pass . $vRow['Salt'],
                    $vRow['PasswordHash'])) {
                $vRetVal = (int)$vRow['CustomerID'];
            }
        }
    } catch (PDOException $e) {
        error_log('queryValidUser failed: ' . $e->getMessage());
        $vRetVal = false;
    }

    return $vRetVal;
}
?>
